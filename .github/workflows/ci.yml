name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: waterway

      - uses: actions/checkout@v4
        with:
          repository: liketrek/TREK
          ref: dev
          path: trek

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            trek/plugin-sdk/package-lock.json
            waterway/package-lock.json

      - name: Build TREK plugin SDK
        working-directory: trek/plugin-sdk
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: waterway
        run: npm ci

      - name: Test, validate, and pack
        working-directory: waterway
        run: npm run ci
