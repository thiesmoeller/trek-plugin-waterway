name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: waterway

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: waterway/package-lock.json

      - name: Install dependencies
        working-directory: waterway
        run: npm ci

      - name: Test, validate, and pack
        working-directory: waterway
        run: npm run ci

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: waterway-plugin-${{ github.sha }}
          path: waterway/plugin.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: waterway-coverage-${{ github.sha }}
          path: waterway/coverage
          if-no-files-found: error
          retention-days: 30
